# Perfil "test": valores NO sensibles, solo para ejecutar la suite de pruebas.
# PostgreSQL sintético local; los tests de integración fuerzan estas propiedades por encima del entorno.
app:
  security:
    jwt:
      secret: test-only-jwt-secret-do-not-use-anywhere-else-0123456789-abcdefghijklmnopqrstuvwxyz

pickup:
  code:
    encryption:
      key: TestOnlyPickupKey_00000000000000

# Legacy databases predate Flyway V4. Only tests add the reconstructed full baseline.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:55439/backend_hardening_test
    username: auth_test
    password: synthetic-test-only
  flyway:
    locations: classpath:db/test-baseline,classpath:db/migration
  task:
    scheduling:
      enabled: false
