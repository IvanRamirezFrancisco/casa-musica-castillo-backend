server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: auth-system

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:security_db}}
    username: ${PGUSER:spring_app}
    # Sin default: la contraseña debe venir del entorno (PGPASSWORD).
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000
      connection-init-sql: SET search_path TO public,auth,security,catalog,sales,customer,ops,analytics

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: public
    schemas: public,auth,security,catalog,sales,customer,ops,analytics

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: false
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

app:
  security:
    # Propietario Técnico (Protección Absoluta)
    protected-owner-emails:
      - "20221087@uthh.edu.mx"

    # JWT seguro mejorado
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:${JWT_SECRET}}
      access-token-expiration: 900000      # 15 minutos
      refresh-token-expiration: 86400000   # 24 horas
      issuer: casa-musica-castillo

    # Autenticación de dos factores
    two-factor:
      issuer: "Casa de Música Castillo"

    # Verificación de usuarios
    verification:
      email:
        expiration: 86400000
      sms:
        expiration: 300000
        max-attempts: 3

    # Rate limiting mejorado
    rate-limiting:
      max-login-attempts: 5
      lockout-duration: 900000

    # Configuración de login seguro
    login:
      max-attempts: 5
      lockout-duration-minutes: 15
      progressive-delay: true

    # Configuración de sesiones
    session:
      max-concurrent-sessions: 3 # Máximo 3 dispositivos simultáneos
      inactivity-timeout-minutes: 15 # Cierre automático después de 15 min sin actividad
      cleanup-interval-minutes: 5 # Limpiar sesiones expiradas cada 5 minutos

    # Recuperación de contraseña segura
    password-reset:
      token-expiration: 3600000  # 1 hora en producción
      max-attempts-per-hour: 2
      max-attempts-per-day: 3
      progressive-delay: true
      cleanup-interval: 86400000  # 24 horas
      base-delay-minutes: 15
      max-delay-minutes: 480

    # Configuración HTTPS - Railway maneja SSL automáticamente
    https:
      force: false

    # Content Security Policy
    csp:
      policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'none';"

    # Logging seguro
    logging:
      mask-sensitive-data: true
      include-ip: true
      detailed-audit: true

    # Evaluación de vulnerabilidades
    assessment:
      enabled: true
      sql-injection-patterns: true
      xss-patterns: true
      dependency-check: true

    # Monitoreo de seguridad
    monitoring:
      enabled: true
      suspicious-threshold: 5
      alert-cooldown-minutes: 15

    # Moderacion de Resenas (Product Reviews)
    reviews:
      moderation:
        enabled: true
        max-links: 2
        repeated-char-threshold: 5
        suspicious-to-pending: true

  # ============================================================
  # BACKUP DE BASE DE DATOS
  # ============================================================
  backup:
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    temp-dir: ${BACKUP_TEMP_DIR:/tmp/casamusica-backups}

  base-url: ${FRONTEND_URL:http://localhost:4200}
  
  # ============================================================
  # MERCADO PAGO CHECKOUT PRO
  # ============================================================
  mercadopago:
    enabled: ${MERCADO_PAGO_ENABLED:true}
    environment: ${MERCADO_PAGO_ENVIRONMENT:TEST}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    public-key: ${MERCADO_PAGO_PUBLIC_KEY:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    frontend-base-url: ${FRONTEND_PUBLIC_BASE_URL:http://localhost:4200}
    backend-base-url: ${BACKEND_PUBLIC_BASE_URL:http://localhost:8080}
  
  
  # Configuración OAuth2.0
  oauth2:
    authorization-code-expiration: 600      # 10 minutos
    access-token-expiration: 3600           # 1 hora
    refresh-token-expiration: 2592000       # 30 días
    redirect-uri-validation: true

  # Configuración CORS (legado: solo AdvancedSecurityConfig, perfil deshabilitado)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://casamusica.com}
  
  # Configuraciones de proveedores de email alternativos
  email:
    sender-name: ${EMAIL_SENDER_NAME:AuthSystem}
    sender-address: ${EMAIL_SENDER_ADDRESS:${MAIL_USERNAME:noreply@authsystem.com}}
    brevo:
      api-key: ${BREVO_API_KEY:#{null}}
    resend:
      api-key: ${RESEND_API_KEY:#{null}}
    mailgun:
      api-key: ${MAILGUN_API_KEY:#{null}}
      domain: ${MAILGUN_DOMAIN:#{null}}

  notification:
    sms:
      provider: sinch
      project-id: ${SINCH_PROJECT_ID:}
      access-key-id: ${SINCH_ACCESS_KEY_ID:}
      secret-key: ${SINCH_SECRET_KEY:}
      from-number: ${SINCH_FROM_NUMBER:+447418630656}
      dev-mode: false

# ── CORS (fuente única: SecurityConfig.corsConfigurationSource) ─────────────
# Lista explícita separada por comas. En producción application-production.yml
# la hace obligatoria (CORS_ORIGINS, sin default). El default localhost aplica
# solo a perfiles de desarrollo/test.
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300,https://localhost}

# ── Clave AES de códigos de recogida (obligatoria, sin default; 16/24/32 bytes) ──
pickup:
  code:
    encryption:
      key: ${PICKUP_CODE_ENCRYPTION_KEY}

# ── Supabase Storage (off-site backup vault) ────────────────────────────────
supabase:
  url: ${SUPABASE_URL:https://dwdteqmfhclrtlknkwcd.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  bucket-name: ${SUPABASE_BUCKET:casamusica-backups}

# ── Storage (Cloudinary / Local) ────────────────────────────────────────────
storage:
  provider: ${STORAGE_PROVIDER:CLOUDINARY}
  local:
    products-path: uploads/products
    brands-path: uploads/brands

logging:
  level:
    root: WARN
    com.security: DEBUG
    com.security.controller.TwoFactorController: DEBUG
    com.security.service.TwoFactorService: DEBUG
    com.security.service.TotpService: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
    org.hibernate: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Health checks para Railway
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
