# Use the existing local database pinned in the private configuration.
# DDL requires separately reviewed authorization: scripts/Invoke-LocalMigrations.ps1.
spring.config.import=file:./.local-dev/application.properties
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.devtools.restart.enabled=false
# Preserve the existing dataset during local validation; request-time security remains enforced.
app.maintenance.enabled=false
server.address=127.0.0.1
server.port=8080
app.base-url=http://localhost:4200
cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost,capacitor://localhost
app.email.provider=smtp
app.email.sender-name=Casa de M\u00fasica Castillo
app.email.sender-address=no-reply@example.test
app.email.brevo.api-key=
app.email.resend.api-key=
app.email.mailgun.api-key=
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false
app.security.https.force=false
app.mercadopago.enabled=false
storage.provider=LOCAL
supabase.service-key=
app.notification.sms.dev-mode=true
logging.level.root=WARN
logging.level.com.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=WARN
app.security.jwt.refresh-cookie-secure=false
app.security.jwt.refresh-cookie-same-site=Lax
# Local public Google OAuth Client ID (no Client Secret) lives in gitignored .local-dev/application.properties or APP_SECURITY_GOOGLE_* env vars.
